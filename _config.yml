# Site settings
title: Joseph Wood
description: I design websites and app interfaces with a focus on simplicity.
url: "https://ithinkiamjoseph.github.io" # Base URL for GitHub Pages
baseurl: "/Jekyll-SN-Pro" # Subpath for repo-name

# Build settings
